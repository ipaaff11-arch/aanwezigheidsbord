<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>aaff. Aanwezigheidsbord Ede</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #007A68;
      --purple: #4B246C;
      --border: #D9DDE2;
      --bg: #F4F5F7;
      --text: #1F2933;
      --muted: #6B7280;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 18px 24px;
    }

    .board {
      background: #FFFFFF;
      border-radius: 20px;
      padding: 20px 28px 22px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.06);
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 16px;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      border-bottom: 2px solid #EFEAF4;
      padding-bottom: 12px;
      gap: 12px;
    }

    .logo {
      font-size: 38px;
      font-weight: 700;
      color: var(--purple);
      letter-spacing: -1px;
    }

    .logo span {
      color: var(--green);
    }

    .greeting-wrap {
      text-align: center;
    }

    .greeting {
      font-family: 'Caveat', cursive;
      font-size: 42px;
      font-weight: 700;
      color: var(--purple);
      line-height: 1;
    }

    .subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
    }

    .datetime {
      text-align: right;
      font-family: 'Caveat', cursive;
      color: var(--purple);
    }

    .datetime .date {
      font-size: 24px;
      line-height: 1.05;
    }

    .datetime .time {
      font-size: 32px;
      font-weight: 700;
      line-height: 1.05;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px 16px;
      align-content: start;
      flex: 1;
      overflow-y: auto;
    }

    .pill {
      height: 52px;
      border-radius: 999px;
      border: 1.5px solid var(--border);
      background: #FFFFFF;
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      padding: 0 14px;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease, transform 0.08s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pill:active {
      transform: scale(0.98);
    }

    .pill.present {
      background: var(--green);
      border-color: var(--green);
      color: #FFFFFF;
    }

    .footer-box {
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      background: #FAFAFB;
      cursor: pointer;
      text-align: left;
      width: 100%;
    }

    .footer-title {
      font-weight: 700;
      font-size: 16px;
      color: var(--text);
    }

    .footer-sub {
      font-size: 13px;
      color: var(--muted);
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: var(--muted);
