<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Aanwezigheid Ede" />
    <meta name="robots" content="noindex, nofollow" />
  <title>aaff. Aanwezigheidsbord Ede</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #007A68;
      --logo-teal: #17B69B;
      --logo-purple: #4E1D76;
      --purple: #4B246C;
      --border: #D9DDE2;
      --bg: #F4F5F7;
      --text: #1F2933;
      --muted: #6B7280;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 18px 24px;
    }

    .board {
      background: #FFFFFF;
      border-radius: 20px;
      padding: 0 28px 22px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.06);
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 16px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #FFFFFF;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      border-bottom: 3px solid var(--purple);
      padding: 20px 0 14px;
      gap: 12px;
    }

    .logo {
      display: flex;
      align-items: center;
      justify-self: start;
    }

    .logo svg {
      height: 36px;
      width: auto;
      display: block;
    }

    .greeting-wrap {
      text-align: center;
    }

    .greeting {
      font-family: 'Caveat', cursive;
      font-size: 42px;
      font-weight: 700;
      color: var(--purple);
      line-height: 1;
    }

    .subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
    }

    .datetime {
      text-align: right;
      font-family: 'Caveat', cursive;
      color: var(--purple);
      padding-right: 16px;
      justify-self: end;
    }

    .datetime .date {
      font-size: 24px;
      line-height: 1.05;
      white-space: nowrap;
    }

    .datetime .time {
      font-size: 32px;
      font-weight: 700;
      line-height: 1.05;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px 16px;
      align-content: start;
      flex: 1;
      overflow-y: auto;
    }

    .pill {
      height: 52px;
      border-radius: 999px;
      border: 3px solid var(--border);
      background: #FFFFFF;
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      padding: 0 14px;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease, transform 0.08s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pill:active {
      transform: scale(0.98);
    }

    .pill.present {
      background: var(--green);
      border-color: var(--green);
      color: #FFFFFF;
    }

    .footer-box {
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      background: #FAFAFB;
      cursor: pointer;
      text-align: left;
      width: 100%;
    }

    .footer-title {
      font-weight: 700;
      font-size: 16px;
      color: var(--text);
    }

    .footer-sub {
      font-size: 13px;
      color: var(--muted);
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: var(--muted);
    }

    .sync-wrap {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .sync-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #16A34A;
      display: inline-block;
      flex-shrink: 0;
    }

    .sync-dot.error {
      background: #DC2626;
    }

    .sync-refresh {
      display: none;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      color: var(--purple);
    }

    .sync-refresh.active {
      display: inline-flex;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 50;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      background: #FFFFFF;
      border-radius: 18px;
      max-width: 440px;
      width: 100%;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
    }

    .modal-card h2 {
      margin: 0 0 8px;
      color: var(--purple);
      font-size: 22px;
    }

    .modal-card p {
      margin: 0 0 18px;
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }

    .modal-close {
      background: var(--green);
      color: #FFFFFF;
      border: none;
      border-radius: 999px;
      padding: 10px 22px;
      font-family: inherit;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="board">
    <header>
      <div class="logo" aria-label="aaff.">
        <svg viewBox="0 0 280 90" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
          <!-- Eerste a -->
          <path fill="#4E1D76" d="M36 27c-17.1 0-30 12.9-30 30s12.9 30 30 30c7.4 0 13.7-2.4 18.2-6.7V85h13.8V29H54.2v4.7C49.7 29.4 43.4 27 36 27zm1 13c9.7 0 17.2 7.3 17.2 17s-7.5 17-17.2 17-17.2-7.3-17.2-17S27.3 40 37 40z"/>
          <!-- Tweede a -->
          <path fill="#4E1D76" d="M107 27c-17.1 0-30 12.9-30 30s12.9 30 30 30c7.4 0 13.7-2.4 18.2-6.7V85h13.8V29h-13.8v4.7C120.7 29.4 114.4 27 107 27zm1 13c9.7 0 17.2 7.3 17.2 17s-7.5 17-17.2 17-17.2-7.3-17.2-17S98.3 40 108 40z"/>
          <!-- Eerste f -->
          <path fill="#4E1D76" d="M180 5c-13.8 0-22 8.2-22 22v2h-8v12.5h8V85h14.5V41.5h13V29h-13v-2c0-5.8 3.1-9 8.8-9 2.3 0 4.4.4 6.2 1V6.2C185.3 5.4 182.7 5 180 5z"/>
          <!-- Tweede f -->
          <path fill="#4E1D76" d="M222 5c-13.8 0-22 8.2-22 22v2h-8v12.5h8V85h14.5V41.5h13V29h-13v-2c0-5.8 3.1-9 8.8-9 2.3 0 4.4.4 6.2 1V6.2C227.3 5.4 224.7 5 222 5z"/>
          <!-- Groene druppelvormige punt -->
          <path fill="#17B69B" d="M255 66c-5.5 0-10 4.5-10 10s4.5 10 10 10h10V76c0-5.5-4.5-10-10-10z"/>
        </svg>
      </div>
      <div class="greeting-wrap">
        <div class="greeting" id="greeting">Goedemiddag, Welkom in Ede.</div>
        <div class="subtitle">Meld je aan of af voor je aanwezigheid</div>
      </div>
      <div class="datetime">
        <div class="date" id="dateText"></div>
        <div class="time" id="timeText"></div>
      </div>
    </header>

    <div class="grid" id="grid"></div>

    <button class="footer-box" id="helpBtn" type="button">
      <div style="font-size:26px;">🎧</div>
      <div>
        <div class="footer-title">Hulp nodig?</div>
        <div class="footer-sub">Neem contact op met Support</div>
      </div>
    </button>

    <div class="status-bar">
      <div class="sync-wrap" id="syncStatus">
        <span>Synchronisatie</span>
        <span class="sync-dot" id="syncDot"></span>
        <span id="syncTime">--:--</span>
        <span class="sync-refresh" id="syncRefresh" aria-label="Bezig met synchroniseren">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
            <polyline points="21 3 21 9 15 9"/>
          </svg>
        </span>
      </div>
      <span id="counterText">0 aanwezig</span>
    </div>
  </div>

  <div class="modal-backdrop" id="helpModal" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
    <div class="modal-card">
      <h2 id="helpTitle">Hulp nodig?</h2>
      <p>Neem contact op met Support of de receptie voor hulp bij het aan- of afmelden op het aanwezigheidsbord.</p>
      <button class="modal-close" id="closeHelpBtn" type="button">Sluiten</button>
    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwbtNJ9-w0ic1DIbiiFkzSa7im2Anz39veneGWyq_M_K43a_s_HyXuqLbO_BlCpA13f/exec";

    const gridEl = document.getElementById("grid");
    const syncDotEl = document.getElementById("syncDot");
    const syncTimeEl = document.getElementById("syncTime");
    const syncRefreshEl = document.getElementById("syncRefresh");
    const counterTextEl = document.getElementById("counterText");
    const helpModalEl = document.getElementById("helpModal");

    let employees = [];
    let isSyncing = false;

    function formatSyncTime(date = new Date()) {
      return date.toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit" });
    }

    function setSyncState({ syncing = false, error = false, updateTime = false } = {}) {
      syncRefreshEl.classList.toggle("active", syncing);
      syncDotEl.classList.toggle("error", error);
      if (updateTime) {
        syncTimeEl.textContent = formatSyncTime();
      }
    }

    function updateClockAndGreeting() {
      const now = new Date();
      const hour = now.getHours();
      let part = "Goedenavond";
      if (hour < 12) part = "Goedemorgen";
      else if (hour < 18) part = "Goedemiddag";

      document.getElementById("greeting").textContent = `${part}, Welkom in Ede.`;

      const days = ["Zondag", "Maandag", "Dinsdag", "Woensdag", "Donderdag", "Vrijdag", "Zaterdag"];
      const months = ["januari", "februari", "maart", "april", "mei", "juni", "juli", "augustus", "september", "oktober", "november", "december"];
      document.getElementById("dateText").textContent =
        `${days[now.getDay()]} ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;
      document.getElementById("timeText").textContent =
        now.toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit" });
    }

    function updateCounter() {
      const count = employees.filter(e => e.present).length;
      counterTextEl.textContent = `${count} van ${employees.length} aanwezig`;
    }

    function renderGrid() {
      gridEl.innerHTML = "";
      employees.forEach((emp, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "pill" + (emp.present ? " present" : "");
        btn.textContent = emp.name;
        btn.addEventListener("click", () => toggleEmployee(idx, btn));
        gridEl.appendChild(btn);
      });
      updateCounter();
    }

    async function loadEmployees(silent = false) {
      if (!WEB_APP_URL || WEB_APP_URL.includes("JOUW_SCRIPT_ID")) {
        setSyncState({ syncing: false, error: true });
        return;
      }

      if (isSyncing) return;
      isSyncing = true;
      setSyncState({ syncing: true, error: false });

      try {
        const res = await fetch(WEB_APP_URL, { cache: "no-store" });
        if (!res.ok) {
          throw new Error(`HTTP ${res.status}`);
        }
        const data = await res.json();
        employees = Array.isArray(data.employees) ? data.employees : [];
        renderGrid();
        setSyncState({ syncing: false, error: false, updateTime: true });
      } catch (err) {
        setSyncState({ syncing: false, error: true });
      } finally {
        isSyncing = false;
      }
    }

    async function toggleEmployee(idx, btn) {
      const emp = employees[idx];
      if (!emp) return;

      const prevPresent = emp.present;
      const nextPresent = !prevPresent;
      emp.present = nextPresent;
      btn.classList.toggle("present", nextPresent);
      updateCounter();
      setSyncState({ syncing: true, error: false });

      try {
        await fetch(WEB_APP_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ row: emp.row, present: nextPresent })
        });
        setSyncState({ syncing: false, error: false, updateTime: true });
      } catch (err) {
        emp.present = prevPresent;
        btn.classList.toggle("present", prevPresent);
        updateCounter();
        setSyncState({ syncing: false, error: true });
      }
    }

    document.getElementById("helpBtn").addEventListener("click", () => {
      helpModalEl.classList.add("open");
    });

    document.getElementById("closeHelpBtn").addEventListener("click", () => {
      helpModalEl.classList.remove("open");
    });

    helpModalEl.addEventListener("click", (e) => {
      if (e.target === helpModalEl) {
        helpModalEl.classList.remove("open");
      }
    });

    updateClockAndGreeting();
    setInterval(updateClockAndGreeting, 15000);
    loadEmployees();
    setInterval(() => loadEmployees(true), 60000);
  </script>
</body>
</html>
